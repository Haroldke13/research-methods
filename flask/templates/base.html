<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Practice build{% endblock %}</title>
<style>
 :root{--ink:#1b1f24;--muted:#5a6472;--line:#d7dee6;--accent:#1f5c8b;--panel:#f6f8fa}
 *{box-sizing:border-box} body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
 header{border-bottom:1px solid var(--line);padding:18px 20px}
 header h1{margin:0;font-size:19px} header p{margin:4px 0 0;color:var(--muted);font-size:14px}
 main{padding:20px;max-width:1100px}
 table{border-collapse:collapse;width:100%;margin:10px 0 20px;font-size:14px;display:block;overflow-x:auto}
 th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
 th{background:var(--accent);color:#fff} tr:nth-child(even) td{background:var(--panel)}
 dl{display:grid;grid-template-columns:minmax(140px,auto) 1fr;gap:4px 14px;margin:10px 0 20px;font-size:14px}
 dt{color:var(--muted)} dd{margin:0}
 .note{background:#fdf6e7;border-left:4px solid #c8862a;padding:12px 14px;margin:0 0 20px;font-size:14px}
 .note b{display:block;margin-bottom:4px} .empty{color:var(--muted);font-style:italic}
 code{background:var(--panel);padding:1px 5px;border-radius:3px;font-size:13px}
 footer{border-top:1px solid var(--line);margin-top:36px;padding:14px 20px;color:var(--muted);font-size:13px}
</style></head><body>
<header><h1>{% block heading %}Practice build{% endblock %}</h1>
<p>Self-directed practice build on synthetic data. Not client work.</p></header>
<main>{% block body %}{% endblock %}</main>
<footer>For viewing and review only. Synthetic data throughout.</footer>
</body></html>
